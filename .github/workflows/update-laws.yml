name: Monatliches Update der Gesetzesdaten

on:
  schedule:
    # Am 1. jedes Monats um 03:00 Uhr UTC
    - cron: '0 3 1 * *'
  workflow_dispatch: # Manuelles Auslösen im GitHub-Interface

permissions:
  contents: write

jobs:
  update-laws:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Gesetzesdatenbanken aktualisieren
        run: |
          echo "Aktualisiere dejure.org..."
          node src/static/updateDejureGesetze.mjs

          echo "Aktualisiere Rewis.io..."
          node src/static/updateRewisGesetze.mjs

          echo "Aktualisiere gesetze.io..."
          node src/static/updateGesetzeIo.mjs

          echo "Aktualisiere Gesetze.co..."
          node src/static/updateGesetzeCo.mjs

          echo "Aktualisiere Jurafuchs..."
          node src/static/updateJurafuchsGesetze.mjs

          echo "Aktualisiere LexMea..."
          node src/static/updateLexmeaGesetze.mjs

          echo "Aktualisiere Gesetzesabkürzungen..."
          python src/static/lawsabkuerzung.py

      - name: Prüfe auf Änderungen
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Änderungen in den Gesetzesdaten festgestellt."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderungen in den Gesetzesdaten festgestellt."
          fi

      - name: Tests ausführen
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm test

      - name: Git konfigurieren
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Datenänderungen committen
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add src/static/
          git commit -m "chore(data): monatliche Aktualisierung der Gesetzesdaten [skip ci]"

      - name: Version bumpen (Patch)
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          npm version patch --tag-version-prefix="" -m "chore(release): %s [skip ci]"

      - name: Produktions-Build erstellen
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Änderungen und Tag pushen
        if: steps.check_changes.outputs.has_changes == 'true'
        run: git push origin master --follow-tags

      - name: GitHub Release erstellen
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          gh release create "$NEW_VERSION" manifest.json main.js styles.css \
            --title "$NEW_VERSION" \
            --notes "Automatisierte monatliche Aktualisierung der Gesetzesdatenbestände (dejure.org, Rewis.io, gesetze.io, Gesetze.co, Jurafuchs, LexMea)."
